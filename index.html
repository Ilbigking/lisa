<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fortnight">
<meta name="theme-color" content="#14121f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Fortnight</title>
</head>
<body>
<div id="app">
  <header>
    <div><p id="hello"></p><h1>Next 14 days</h1></div>
    <button id="openSettings" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>
  <section id="notifBanner" hidden>
    <span>🔔 Get a nudge when tasks are due</span>
    <button id="enableNotif">Enable</button>
  </section>
  <main id="days"></main>
</div>
<button id="fab" aria-label="Add task">+</button>

<div class="sheet" id="addSheet">
  <form class="panel" id="addForm" autocomplete="off">
    <h3>New task</h3>
    <input id="fTitle" placeholder="What's the plan?" required maxlength="80">
    <label>Day</label><select id="fDate"></select>
    <label>Time (optional)</label><input id="fTime" type="time">
    <label>Category</label><div class="chips" id="fCats"></div>
    <label>Vibe</label><div class="chips" id="fVibes"></div>
    <button class="primary">Add task</button>
  </form>
</div>

<div class="sheet" id="setSheet">
  <div class="panel">
    <h3>Settings</h3>
    <button class="ghost" id="testNotif">Send test notification</button>
    <button class="ghost" id="export">Export backup (JSON)</button>
    <label class="ghost" for="import">Import backup…</label>
    <input type="file" id="import" accept="application/json,.json">
    <button class="ghost" id="closeSet">Close</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
